<script>
// ============================================================
// CONFIG
// ============================================================
const FIXED_INDEX_URL = "https://raw.githubusercontent.com/punksgif/punksgif.github.io/main/index.json";
const SECTIONS_ORDER = ["Background","Base","Nose","Face","Neck","Mouth","Head","Eyes","Beard","Accessory","Ear"];
const STORAGE_KEY = '404punks_current_nft';

// ============================================================
// FIREBASE
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDdhpduaTwzPGPSN83oeS1JX0ElRF6QKik",
  authDomain: "bdpunks.firebaseapp.com",
  databaseURL: "https://bdpunks-default-rtdb.firebaseio.com",
  projectId: "bdpunks",
  storageBucket: "bdpunks.firebasestorage.app",
  messagingSenderId: "699146288467",
  appId: "1:699146288467:web:1bfdbcbb5b8d3047db75a6"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ============================================================
// STATE
// ============================================================
let layersBySection = {};
let currentNFT = null;
let matchIndexMap = new Map();
let isIndexLoaded = false;

SECTIONS_ORDER.forEach(s => { layersBySection[s] = []; });

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));
}

function showToast(m, dur=3000) {
  let t = document.getElementById('toast');
  t.innerText = m;
  t.classList.remove('hidden');
  clearTimeout(window.tt);
  window.tt = setTimeout(() => t.classList.add('hidden'), dur);
}

// ============================================================
// MATCH ENGINE
// ============================================================
function extractAllTraitValues(attributes) {
  const values = [];
  for (const attr of attributes) {
    if (!attr.value) continue;
    if (attr.trait_type && attr.trait_type.toLowerCase() === "attribute count") continue;
    values.push(String(attr.value).toLowerCase().trim());
  }
  values.sort();
  return values;
}

function createMatchKey(values) { return values.join("|"); }

async function loadIndexJSON() {
  showToast('Loading index...');
  try {
    const response = await fetch(FIXED_INDEX_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    matchIndexMap.clear();
    let totalTokens = 0;
    for (const [tokenId, tokenData] of Object.entries(data)) {
      if (!tokenData.attributes) continue;
      const traitValues = extractAllTraitValues(tokenData.attributes);
      if (traitValues.length > 0) {
        matchIndexMap.set(tokenId, createMatchKey(traitValues));
        totalTokens++;
      }
    }
    isIndexLoaded = true;
    showToast(`Index loaded! ${totalTokens} tokens`);
    if (currentNFT) updateMatchDisplay();
  } catch(err) {
    console.warn('Index load failed:', err);
    isIndexLoaded = false;
  }
}

function getNFTTraitKey(nft) {
  if (!nft || !nft.layers) return '';
  const values = [];
  for (const l of nft.layers) {
    if (l.section !== 'Background') values.push(String(l.value).toLowerCase().trim());
  }
  values.sort();
  return createMatchKey(values);
}

function findMatchesForNFT(nft) {
  if (!isIndexLoaded || !nft) return [];
  const myKey = getNFTTraitKey(nft);
  if (!myKey) return [];
  const matched = [];
  for (const [tokenId, indexKey] of matchIndexMap.entries()) {
    if (indexKey === myKey) matched.push(Number(tokenId));
  }
  matched.sort((a,b)=>a-b);
  return matched;
}

function showMatchPopup(matches) {
  const popup = document.getElementById('match-popup');
  const content = document.getElementById('match-popup-content');
  
  if (!matches.length) {
    content.innerHTML = '<div style="text-align:center; padding:20px;">❌ No matching CryptoPunks found</div>';
  } else {
    const punkIds = matches.map(id => id);
    const punkLinks = punkIds.map(id => 
      `<div style="margin: 8px 0;">
         <a href="https://www.cryptopunks.app/cryptopunks/details/${id}" target="_blank" style="color:#00ff00; text-decoration:underline; font-family:'Press Start 2P',monospace; font-size:9px;">🔗 CryptoPunk #${id}</a>
       </div>`
    ).join('');
    
    content.innerHTML = `
      <div style="margin-bottom: 15px; text-align:center; color:#ffff00;">
        🎯 ${matches.length} identical token${matches.length > 1 ? 's' : ''} found in CryptoPunks!
      </div>
      <div style="background:#000080; border:2px inset #808080; padding:12px; margin-bottom:10px;">
        <div style="color:#ccccff; font-size:8px; margin-bottom:8px;">MATCHING CRYPTOPUNK IDS:</div>
        ${punkLinks}
      </div>
      <div style="font-size:7px; color:#aaaaff; text-align:center; margin-top:10px;">
        These 404 PUNKS share the exact same traits as the CryptoPunks above.
      </div>
    `;
  }
  
  popup.style.display = 'flex';
}

function updateMatchDisplay() {
  const container = document.getElementById('match-container');
  if (!container || !currentNFT) return;
  if (!isIndexLoaded) {
    container.innerHTML = '<div class="match-badge-loading">Loading index...</div>';
    return;
  }
  const matches = findMatchesForNFT(currentNFT);
  if (!matches.length) {
    container.innerHTML = '<div class="match-badge" style="background:#404040; color:#cccccc; cursor:default;">❌ NO MATCH FOUND IN CRYPTO PUNKS</div>';
  } else {
    const showIds = matches.slice(0, 5).map(n => '#' + n).join(', ');
    const extra = matches.length > 5 ? ` +${matches.length-5}` : '';
    container.innerHTML = `<div class="match-badge success-bg" onclick="App.showMatchPopup(${JSON.stringify(matches).replace(/"/g, '&quot;')})">
      🎯 MATCH FOUND! (${matches.length} identical)<br>
      <span style="font-size:7px;">${showIds}${extra} - CLICK FOR DETAILS</span>
    </div>`;
  }
}

// ============================================================
// LAYER MANAGEMENT (Firebase)
// ============================================================
function listenFirebase() {
  showToast('Loading layers...');
  database.ref('layers').on('value', snap => {
    let d = snap.val();
    if (d && typeof d === 'object') {
      for (let s of SECTIONS_ORDER) {
        let raw = d[s];
        if (!raw) { layersBySection[s] = []; continue; }
        if (Array.isArray(raw)) {
          layersBySection[s] = raw.filter(Boolean);
        } else if (typeof raw === 'object') {
          layersBySection[s] = Object.values(raw).filter(Boolean);
        } else {
          layersBySection[s] = [];
        }
      }
      showToast('Layers loaded from Firebase');
    } else {
      showToast('Using default layers');
    }
    updateStats();
  }, err => {
    console.error('Firebase error:', err);
  });
}

// ============================================================
// IMAGE COMPOSITING
// ============================================================
const imageCache = new Map();

function loadImage(url) {
  if (imageCache.has(url)) return Promise.resolve(imageCache.get(url));
  return new Promise(res => {
    let img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = () => { imageCache.set(url, img); res(img); };
    img.onerror = () => { imageCache.set(url, null); res(null); };
    img.src = url;
  });
}

async function compositeFromLayers(layers, w=400, h=400) {
  let canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  let ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  
  const images = await Promise.all(layers.map(l => loadImage(l.imageUrl)));
  for (let img of images) {
    if (img) ctx.drawImage(img, 0, 0, w, h);
  }
  return canvas.toDataURL('image/png');
}

// ============================================================
// YOUTUBE BANNER GENERATION (2560x1440) - NFT LEFT, ATTRIBUTES RIGHT
// ============================================================
async function generateBanner() {
  if (!currentNFT) return null;
  
  const width = 2560;
  const height = 1440;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  
  // Background - dark gradient
  const gradient = ctx.createLinearGradient(0, 0, width, height);
  gradient.addColorStop(0, '#0a0a2a');
  gradient.addColorStop(1, '#1a1a3a');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  
  // Pixel border effect
  ctx.strokeStyle = '#ffff00';
  ctx.lineWidth = 6;
  ctx.strokeRect(15, 15, width - 30, height - 30);
  
  // ========== LEFT SIDE: NFT IMAGE ==========
  const imgSize = 800;
  const imgX = 120;
  const imgY = (height - imgSize) / 2;
  
  // Load and draw NFT image
  const nftImg = new Image();
  await new Promise((resolve) => {
    nftImg.onload = resolve;
    nftImg.src = currentNFT.image;
  });
  
  // Shadow effect
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 15;
  ctx.drawImage(nftImg, imgX, imgY, imgSize, imgSize);
  ctx.shadowBlur = 0;
  
  // NFT border
  ctx.strokeStyle = '#ffff00';
  ctx.lineWidth = 5;
  ctx.strokeRect(imgX, imgY, imgSize, imgSize);
  
  // ========== RIGHT SIDE: NFT NAME ==========
  const rightX = imgX + imgSize + 100;
  let currentY = 180;
  
  // Title "404 PUNKS"
  ctx.fillStyle = '#ffff00';
  ctx.font = '56px "Press Start 2P"';
  ctx.textAlign = 'left';
  ctx.shadowBlur = 6;
  ctx.shadowColor = '#ff0000';
  ctx.fillText('404 PUNKS', rightX, currentY);
  ctx.shadowBlur = 0;
  currentY += 80;
  
  // NFT Name
  ctx.fillStyle = '#00ff00';
  ctx.font = '32px "Press Start 2P"';
  ctx.fillText(currentNFT.name, rightX, currentY);
  currentY += 70;
  
  // Divider line
  ctx.strokeStyle = '#4444ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rightX, currentY);
  ctx.lineTo(width - 80, currentY);
  ctx.stroke();
  currentY += 50;
  
  // ========== ATTRIBUTES SECTION ==========
  ctx.fillStyle = '#ccccff';
  ctx.font = '24px "Press Start 2P"';
  ctx.fillText('ATTRIBUTES', rightX, currentY);
  currentY += 55;
  
  const attrs = currentNFT.attributes.filter(a => a.trait_type !== 'Attribute Count');
  
  // Wider boxes for long text
  const boxWidth = 380;
  const boxHeight = 50;
  const spacing = 12;
  
  for (let i = 0; i < attrs.length; i++) {
    const attr = attrs[i];
    const y = currentY + (i * (boxHeight + spacing));
    
    if (y + boxHeight > height - 150) break;
    
    ctx.fillStyle = '#000080';
    ctx.fillRect(rightX, y, boxWidth, boxHeight);
    ctx.strokeStyle = '#4444ff';
    ctx.strokeRect(rightX, y, boxWidth, boxHeight);
    
    ctx.fillStyle = '#ffff00';
    ctx.font = 'bold 16px "Press Start 2P"';
    let typeText = attr.trait_type;
    if (typeText.length > 12) typeText = typeText.substring(0, 10) + '..';
    ctx.fillText(typeText, rightX + 15, y + 33);
    
    ctx.fillStyle = '#00ff00';
    ctx.font = '15px "Press Start 2P"';
    let valueText = attr.value;
    const maxValueWidth = boxWidth - 180;
    ctx.save();
    let fontSize = 15;
    ctx.font = `${fontSize}px "Press Start 2P"`;
    while (ctx.measureText(valueText).width > maxValueWidth && fontSize > 10) {
      fontSize--;
      ctx.font = `${fontSize}px "Press Start 2P"`;
    }
    if (fontSize < 11) {
      valueText = valueText.substring(0, 18) + '...';
      ctx.font = `11px "Press Start 2P"`;
    }
    ctx.fillText(valueText, rightX + boxWidth - 15 - ctx.measureText(valueText).width, y + 33);
    ctx.restore();
  }
  
  const attrsBottom = currentY + (attrs.length * (boxHeight + spacing)) + 30;
  const matchY = Math.max(attrsBottom + 30, height - 130);
  
  const matches = findMatchesForNFT(currentNFT);
  const matchBoxWidth = width - rightX - 80;
  const matchBoxHeight = 85;
  
  ctx.fillStyle = matches.length > 0 ? '#006400' : '#404040';
  ctx.fillRect(rightX, matchY, matchBoxWidth, matchBoxHeight);
  ctx.strokeStyle = matches.length > 0 ? '#00ff00' : '#808080';
  ctx.strokeRect(rightX, matchY, matchBoxWidth, matchBoxHeight);
  
  ctx.fillStyle = '#ffff00';
  ctx.font = '18px "Press Start 2P"';
  ctx.textAlign = 'center';
  const centerX = rightX + matchBoxWidth / 2;
  
  if (matches.length > 0) {
    ctx.fillText(`🎯 MATCH FOUND! ${matches.length} identical tokens`, centerX, matchY + 38);
    ctx.font = '13px "Press Start 2P"';
    ctx.fillStyle = '#00ff00';
    const matchStr = matches.slice(0, 8).map(n => '#' + n).join(', ');
    ctx.fillText(matchStr + (matches.length > 8 ? ` +${matches.length-8} more` : ''), centerX, matchY + 68);
  } else {
    ctx.fillText('❌ NO MATCH FOUND IN CRYPTO PUNKS', centerX, matchY + 48);
  }
  
  ctx.fillStyle = '#8888aa';
  ctx.font = '12px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('404 PUNKS // UNIVERSAL NFT GENERATOR', width / 2, height - 35);
  
  return canvas.toDataURL('image/png');
}

function buildNFTAttributes(layers) {
  let attrs = [];
  let baseValue = null;
  for (let l of layers) { if (l.section === "Base") { baseValue = l.value; break; } }
  if (baseValue) attrs.push({ trait_type: "Base", value: baseValue });
  for (let l of layers) {
    if (l.section === "Background" || l.section === "Base") continue;
    attrs.push({ trait_type: l.section, value: l.value });
  }
  attrs.push({ trait_type: "Attribute Count", value: attrs.length.toString() });
  return attrs;
}

function generateRandomLayers(gender) {
  let pickedLayers = [];
  
  const bgLayers = (layersBySection['Background'] || []).filter(l => l.gender === 'both' || l.gender === gender);
  if (!bgLayers.length) return null;
  const bg = bgLayers[Math.floor(Math.random() * bgLayers.length)];
  pickedLayers.push({ section: 'Background', value: bg.value, imageUrl: bg.imageUrl });
  
  const baseLayers = (layersBySection['Base'] || []).filter(l => l.gender === 'both' || l.gender === gender);
  if (!baseLayers.length) return null;
  const base = baseLayers[Math.floor(Math.random() * baseLayers.length)];
  pickedLayers.push({ section: 'Base', value: base.value, imageUrl: base.imageUrl });
  
  for (let s of SECTIONS_ORDER) {
    if (s === 'Background' || s === 'Base') continue;
    const available = (layersBySection[s] || []).filter(l => l.gender === 'both' || l.gender === gender);
    if (!available.length) continue;
    
    const includeChance = s === 'Neck' ? 0.10 : s === 'Face' ? 0.07 : s === 'Nose' ? 0.04 : s === 'Mouth' ? 0.16 : s === 'Ear' ? 0.40 : s === 'Accessory' ? 0.55 : 0.65;
    if (Math.random() < includeChance) {
      const picked = available[Math.floor(Math.random() * available.length)];
      pickedLayers.push({ section: s, value: picked.value, imageUrl: picked.imageUrl });
    }
  }
  
  pickedLayers.sort((a, b) => SECTIONS_ORDER.indexOf(a.section) - SECTIONS_ORDER.indexOf(b.section));
  return pickedLayers;
}

function renderAttributes(attributes) {
  const container = document.getElementById('attributes-list');
  if (!container) return;
  if (!attributes || attributes.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:20px;">No attributes</div>';
    return;
  }
  container.innerHTML = attributes.map(attr => `
    <div class="attribute-row">
      <span class="attribute-label">${escapeHtml(attr.trait_type)}</span>
      <span class="attribute-value">${escapeHtml(attr.value)}</span>
    </div>
  `).join('');
}

async function createRandomNFT() {
  const btn = document.getElementById('create-nft-btn');
  btn.disabled = true;
  btn.innerText = 'GENERATING...';
  
  try {
    const gender = Math.random() < 0.5 ? 'male' : 'female';
    const layers = generateRandomLayers(gender);
    if (!layers) {
      showToast('Not enough layers! Add layers via Firebase.');
      btn.disabled = false;
      btn.innerText = 'CREATE NFT';
      return;
    }
    
    const image = await compositeFromLayers(layers);
    const attributes = buildNFTAttributes(layers);
    const serial = Math.floor(Math.random() * 10000);
    
    currentNFT = {
      id: Date.now() + '_' + Math.random().toString(36).substr(2, 8),
      name: `404 PUNKS #${serial}`,
      description: '404 PUNKS // RETRO GLITCH COLLECTION',
      image: image,
      attributes: attributes,
      layers: layers,
      gender: gender,
      createdAt: new Date().toISOString()
    };
    
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentNFT));
    
    document.getElementById('nft-info').classList.remove('hidden');
    document.getElementById('nft-name').innerText = currentNFT.name;
    document.getElementById('nft-desc').innerText = currentNFT.description;
    document.getElementById('nft-gender').innerHTML = gender === 'male' ? '<span class="gender-badge-m">♂ MALE</span>' : '<span class="gender-badge-f">♀ FEMALE</span>';
    
    renderAttributes(currentNFT.attributes);
    
    const canvas = document.getElementById('nft-canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
    img.src = image;
    
    updateMatchDisplay();
    updateStats();
    showToast('NFT created!');
    
  } catch(err) {
    console.error(err);
    showToast('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = 'CREATE NFT';
  }
}

function renderLayersEditor() {
  const container = document.getElementById('layers-editor');
  if (!container || !currentNFT) return;
  
  container.innerHTML = (currentNFT.layers || []).map((l, idx) => `
    <div class="layer-row">
      <div style="display:flex; align-items:center; gap:8px; flex:1;">
        <img src="${l.imageUrl}" style="width:40px; height:40px; object-fit:contain; border:1px solid #808080;">
        <span style="font-family:'Press Start 2P',monospace; font-size:8px;">${idx+1}. ${l.section}: ${escapeHtml(l.value)}</span>
      </div>
      <div style="display:flex; gap:4px;">
        <button onclick="App.moveLayer(${idx},'up')" class="move-btn">▲</button>
        <button onclick="App.moveLayer(${idx},'down')" class="move-btn">▼</button>
        <button onclick="App.deleteLayer(${idx})" class="move-btn" style="border-color:#ff4444; color:#aa0000;">✕</button>
      </div>
    </div>
  `).join('');
  
  renderAvailableLayers();
}

function renderAvailableLayers() {
  const section = document.getElementById('add-layer-section').value;
  const gender = currentNFT ? currentNFT.gender : 'both';
  const layers = (layersBySection[section] || []).filter(l => l.gender === 'both' || l.gender === gender);
  const container = document.getElementById('available-layers');
  
  if (!layers.length) {
    container.innerHTML = '<div style="font-family:\'Press Start 2P\',monospace; font-size:7px; text-align:center; padding:20px;">[ NO LAYERS IN THIS SECTION ]</div>';
    return;
  }
  
  container.innerHTML = layers.map(l => `
    <div onclick="App.addLayerToNFT('${section}','${escapeHtml(l.value).replace(/'/g,"\\'")}','${l.imageUrl.replace(/'/g,"\\'")}')"
      style="border:2px outset #808080; padding:6px; background:#d4d0c8; cursor:pointer; text-align:center;">
      <div style="aspect-ratio:1; background:#fff;"><img src="${l.imageUrl}" style="width:100%; height:100%; object-fit:contain;"></div>
      <div style="font-family:'Press Start 2P',monospace; font-size:6px; margin-top:4px;">${escapeHtml(l.value)}</div>
    </div>
  `).join('');
}

async function addLayerToNFT(section, value, imageUrl) {
  if (!currentNFT) return;
  currentNFT.layers = (currentNFT.layers || []).filter(l => l.section !== section);
  currentNFT.layers.push({ section, value, imageUrl });
  currentNFT.layers.sort((a, b) => SECTIONS_ORDER.indexOf(a.section) - SECTIONS_ORDER.indexOf(b.section));
  await recomposeAndRefresh();
  showToast(`Added: ${section} → ${value}`);
}

async function moveLayer(index, direction) {
  if (!currentNFT || !currentNFT.layers) return;
  let newLayers = [...currentNFT.layers];
  if (direction === 'up' && index > 0) {
    [newLayers[index], newLayers[index-1]] = [newLayers[index-1], newLayers[index]];
  } else if (direction === 'down' && index < newLayers.length-1) {
    [newLayers[index], newLayers[index+1]] = [newLayers[index+1], newLayers[index]];
  } else return;
  currentNFT.layers = newLayers;
  await recomposeAndRefresh();
  showToast('Layer moved');
}

async function deleteLayer(index) {
  if (!currentNFT || !currentNFT.layers) return;
  const removed = currentNFT.layers[index];
  if (confirm(`DELETE "${removed.section}: ${removed.value}"?`)) {
    currentNFT.layers.splice(index, 1);
    await recomposeAndRefresh();
    showToast('Layer removed');
  }
}

async function recomposeAndRefresh() {
  if (!currentNFT) return;
  currentNFT.image = await compositeFromLayers(currentNFT.layers);
  currentNFT.attributes = buildNFTAttributes(currentNFT.layers);
  
  localStorage.setItem(STORAGE_KEY, JSON.stringify(currentNFT));
  
  const canvas = document.getElementById('nft-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = currentNFT.image;
  
  renderAttributes(currentNFT.attributes);
  renderLayersEditor();
  updateMatchDisplay();
  updateStats();
}

function updateStats() {
  let totalLayers = 0;
  for (let s of SECTIONS_ORDER) {
    totalLayers += (layersBySection[s] || []).length;
  }
  document.getElementById('stat-layers').innerText = totalLayers;
  
  if (currentNFT && currentNFT.layers) {
    const traitCount = currentNFT.layers.filter(l => l.section !== 'Background' && l.section !== 'Base').length;
    document.getElementById('stat-traits').innerText = traitCount;
    
    const key = getNFTTraitKey(currentNFT);
    const isUnique = isIndexLoaded ? !matchIndexMap.has(key) : true;
    document.getElementById('stat-unique').innerHTML = isUnique ? '✅ YES' : '⚠️ DUPLICATE';
  } else {
    document.getElementById('stat-traits').innerText = '0';
    document.getElementById('stat-unique').innerHTML = '-';
  }
}

function openEditor() {
  if (!currentNFT) return;
  renderLayersEditor();
  document.getElementById('editor-modal').style.display = 'flex';
}

function closeEditor() {
  document.getElementById('editor-modal').style.display = 'none';
}

function loadSavedNFT() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      currentNFT = JSON.parse(saved);
      document.getElementById('nft-info').classList.remove('hidden');
      document.getElementById('nft-name').innerText = currentNFT.name;
      document.getElementById('nft-desc').innerText = currentNFT.description;
      document.getElementById('nft-gender').innerHTML = currentNFT.gender === 'male' ? '<span class="gender-badge-m">♂ MALE</span>' : '<span class="gender-badge-f">♀ FEMALE</span>';
      
      renderAttributes(currentNFT.attributes);
      
      const canvas = document.getElementById('nft-canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = currentNFT.image;
      
      updateMatchDisplay();
      updateStats();
    } else {
      const canvas = document.getElementById('nft-canvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000080';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffff00';
      ctx.font = '20px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('404', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '12px "Press Start 2P"';
      ctx.fillText('PUNKS', canvas.width/2, canvas.height/2 + 20);
    }
  } catch(e) {}
}
