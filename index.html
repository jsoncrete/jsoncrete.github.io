<!doctype html>
<html lang="bn">
 <head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Transfer Tool</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .styled-image {
            filter: contrast(1.6) saturate(2.2) brightness(1.1);
        }
        .drop-zone.dragover {
            border-color: #a855f7;
            background: rgba(168,85,247,0.1);
        }
    </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root" class="min-h-screen">
  <svg style="position:absolute;width:0;height:0"><filter id="posterize">
    <fecomponenttransfer>
     <fefuncr type="discrete" tablevalues="0 0.2 0.4 0.6 0.8 1" />
     <fefuncg type="discrete" tablevalues="0 0.2 0.4 0.6 0.8 1" />
     <fefuncb type="discrete" tablevalues="0 0.2 0.4 0.6 0.8 1" />
    </fecomponenttransfer>
   </filter>
  </svg>
  <header class="p-6 text-center">
   <h1 data-template-id="page-title" class="canva-text font-bold"></h1>
   <p data-template-id="subtitle" class="canva-text mt-2"></p>
  </header>
  <main class="max-w-5xl mx-auto px-4 pb-12"><!-- Reference Style -->
   <section class="mb-8 text-center">
    <p data-template-id="ref-label" class="canva-text mb-3 font-medium"></p><img data-template-id="ref-image" class="canva-image mx-auto w-48 h-48 object-cover rounded-xl shadow-lg" loading="lazy">
   </section><!-- Upload Area -->
   <div id="drop-zone" class="drop-zone border-2 border-dashed border-purple-400 rounded-2xl p-10 text-center cursor-pointer hover:border-purple-600 transition-colors mb-8"><i data-lucide="upload" class="mx-auto mb-3 text-purple-500" style="width:48px;height:48px"></i>
    <p data-template-id="upload-text" class="canva-text font-medium"></p>
    <p data-template-id="upload-hint" class="canva-text text-sm mt-1 opacity-70"></p><input type="file" id="file-input" accept="image/*" class="hidden">
   </div><!-- Result -->
   <div id="result-area" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
     <div class="text-center">
      <p data-template-id="original-label" class="canva-text font-medium mb-2"></p><img id="original-img" class="w-full rounded-xl shadow">
     </div>
     <div class="text-center">
      <p data-template-id="styled-label" class="canva-text font-medium mb-2"></p><img id="styled-img" class="w-full rounded-xl shadow styled-image" style="filter:url(#posterize) contrast(1.6) saturate(2.2) brightness(1.1)">
     </div>
    </div>
    <div class="flex justify-center gap-4"><button data-template-id="download-btn" class="canva-button px-6 py-3 rounded-xl font-medium shadow-lg hover:scale-105 transition-transform" onclick="downloadStyled()"></button> <button data-template-id="next-btn" class="canva-button px-6 py-3 rounded-xl font-medium shadow-lg hover:scale-105 transition-transform" onclick="resetUpload()"></button>
    </div>
   </div>
  </main>
  <canvas id="export-canvas" class="hidden"></canvas>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        lucide.createIcons();

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const resultArea = document.getElementById('result-area');
        const originalImg = document.getElementById('original-img');
        const styledImg = document.getElementById('styled-img');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const url = URL.createObjectURL(file);
            originalImg.src = url;
            styledImg.src = url;
            dropZone.classList.add('hidden');
            resultArea.classList.remove('hidden');
        }

        function downloadStyled() {
            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.filter = 'contrast(1.6) saturate(2.2) brightness(1.1)';
                ctx.drawImage(img, 0, 0);
                const link = document.createElement('a');
                link.download = 'styled-image.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            img.src = styledImg.src;
        }

        function resetUpload() {
            resultArea.classList.add('hidden');
            dropZone.classList.remove('hidden');
            fileInput.value = '';
        }
    </script>

</html>
